# The `ptc-cordis` agent preset: PTC mode, plus the ability to
# read and write the runtime it is running on.
#
# The shipped `ptc` preset is the standard agent presented through the PTC
# mode SDK (`run_code` composes multi-step operations as one TypeScript
# program). The shipped `cordis` preset is the standard agent plus the
# self-referential Cordis toolset and composition-authoring guidance. This
# preset is the union: everything in `ptc` unchanged — including the
# `tool-presentation` row — plus the Creation-mode additions:
#
#   - a persona that teaches both the two composition planes and PTC
#     composition, so authored presets and plugin experiments are planned on
#     the correct plane,
#   - the `tool-cordis` row: `cordis_inspect` / `cordis_define` / `cordis_run`
#     / `cordis_stop` / `cordis_undefine` over the live runtime,
#   - the composition-authoring skills travelling with this preset's own
#     `skills/` directory.
#
# The `dsh-ptc-cordis-preset` plugin materializes this file into the user
# preset root; its skills directory is copied from the installed shipped
# `cordis` preset at materialize time, so the guidance tracks the deployment.
#
# TRUST: identical to the shipped `cordis` preset — the Cordis toolset
# evaluates model-written JavaScript against the live runtime, so treat a
# session on this preset as shell access.
#
# This file is an AGENT-PLANE composition, mounted under one agent's scope
# context. A service row here MUST sit inside a group carrying an `isolate`
# realm, or it publishes into the process-global root realm and the second
# session mounting this preset collides with the first.
#
# ERA: dsh >= 0.1.2 text (built-in preset id `ptc`, mode: ptc). The dsh <= 0.1.1
# era text lives in agent.cordis.yml / agent.cordis.gitbash.yml; the plugin
# probes the roster at materialization and writes the picked text as the
# preset's own agent.cordis.yml.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      You can read and modify the harness you run on. Its composition is Cordis: every capability is a plugin row in a `cordis.yml`, and an agent preset is one such file mounted for a single session.

      Two planes decide where an edit belongs. The HOST composition holds the registries and anything shared across sessions — persistence, the sandbox and approval stack, the model route, the subagent registry and its backends. An AGENT PRESET holds what one session contributes to those registries: its tools, its persona, its prompt sections. A row that publishes a service belongs in the host composition, or inside an `isolate` realm if the preset genuinely owns that service and nothing outside one agent reads it.

      Presets you author live one directory per preset under `${DSH_HOME:-$HOME/.dsh}/.agent-presets/<id>/`; the roster reports each preset's real path, so take the one you edit from there. NEVER edit or delete the shipped preset install (the `agent-presets` directory beside the deployment's own config): it belongs to the deployment, an upgrade overwrites it, and corrupting the `cordis` preset would disable this very mode. To change what a shipped preset does, copy its composition into a new preset directory and edit the copy.

      Your tools are presented through PTC mode: instead of one tool call per action, you compose multi-step operations as a single TypeScript program against a generated SDK and run it with `run_code`, so a sequence that would be five round trips becomes one. The self-referential Cordis toolset — `cordis_inspect`, `cordis_define`, `cordis_run`, `cordis_stop`, `cordis_undefine` — is part of that SDK like any other tool: compose runtime inspection, dynamic-plugin experiments, and preset authoring into your programs the same way.

      Load the `editing-cordis-compositions` skill before writing or changing a composition.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row. The registry is keyed by owning agent anyway, so one
# host instance serves every session.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset,
# and `tool-skill` gives them the catalog and loader. The Creation-mode
# composition-authoring skills travel with this preset's own directory
# (`customSkillDirs`); `baseUrl` is the preset's own directory, so the root
# resolves wherever the preset is installed.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane; the human `/goal`
# command and the model-facing tool register into this preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it. `tokenMeter` is deliberately NOT
# in this realm: the meter stays on the HOST plane, and the rows here resolve
# that one instance.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition; this preset contributes the delegation TOOLS, which resolve that
# host registry. `workflows` is different — nothing outside an agent reads it —
# so every row that reaches it shares one entry-local realm here.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable and accepts its child-scoped `report` additions invalidating
    # that prefix; issue #2124 tracks cache-preserving continuable fork.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── presentation (PTC mode) ─────────────────────────────────────────────────

# PTC mode for this agent alone. The row waits for the host's `codeRuntime`
# rather than assuming it: a deployment that composes no TypeScript runtime
# fails this preset at mount, naming this id, instead of at the first request.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: ptc

# ── self-modification (Creation mode) ───────────────────────────────────────

# The self-referential Cordis toolset: read the live runtime, define and run
# dynamic plugin packages, stop and forget them. Bare, exactly like the shipped
# `cordis` preset: it consumes the HOST-plane runner the web app bundle mounts.
#
# Do NOT wrap this row (plus a private `dsh-cordis-host-runner`) in an isolate
# realm — v0.2.0 tried that to dodge the provider-registration collision and it
# severed the browser bridge instead: the browser half of the runner injects
# `remote.dynamicCordisRunner`, which resolves ONLY the host-plane instance, so
# a realm-private runner is an island — Client-package approval cards never
# render (the grant queue and the ack channel live inside the runner), Client
# inspect providers never sync, Client halves cannot activate, and dynamically
# registered tools stay invisible to the agent.
#
# COEXISTENCE: the host runner's inspect registry is a process singleton with
# id-keyed provider registration that throws on a duplicate. The shipped
# `cordis` preset and this one register the SAME 9 providers from the SAME
# package, so `dsh-ptc-cordis-preset` ships a compatibility shim: on an
# "already registered" collision it replaces the stored entry instead of
# throwing (identical manifests make that a no-op for consumers; the
# identity-guarded disposer keeps teardown consistent). With the shim — since
# 0.4.0, install timing fixed in 0.6.3 (it now waits for the runner's
# `cordisInspect` service instead of sampling it once at startup) — a session
# on the shipped `cordis` preset and one on this preset coexist in one
# process. The structural fix remains product-side: make the runner
# per-session or its provider registration namespace-isolated.
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
